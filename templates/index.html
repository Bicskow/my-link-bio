<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>My Links</title>
</head>
<body>
    <main class="page">
        <nav class="navigation"><a href="{{ url_for('about') }}">About</a></nav>
        <h1 class="page-title">My Links</h1>
        <form class="link-form" action="{{ url_for('add_link') }}" method="post">
            <label for="name">Site name</label>
            <input type="text" id="name" name="name" required>
            <label for="url">URL</label>
            <input type="url" id="url" name="url" required>
            <button type="submit">Add Link</button>
        </form>
        <ul class="link-list" aria-label="My links">
            {% for link in links %}
            <li class="link-card">
                <a class="card-link" href="{{ link.url }}">{{ link.name }}</a>
                <a class="edit-button" href="{{ url_for('edit_link', link_id=link.id) }}" aria-label="Edit {{ link.name }}">Edit</a>
                <form action="{{ url_for('delete_link', link_id=link.id) }}" method="post">
                    <button class="delete-button" type="submit" aria-label="Delete {{ link.name }}">Delete</button>
                </form>
                <dl class="link-metadata">
                    <div>
                        <dt>Title</dt>
                        <dd>{{ link.title }}</dd>
                    </div>
                    <div>
                        <dt>Description</dt>
                        <dd>{{ link.description }}</dd>
                    </div>
                    <div>
                        <dt>Image URL</dt>
                        <dd>{{ link.image_url }}</dd>
                    </div>
                </dl>
            </li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
